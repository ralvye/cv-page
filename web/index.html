  <style>
    :root {
      --bg: #000;
      --text: #999;
      --heading: #fff;
      --link: #666;
      --link-hover: #fff;
      --hint: #555;
      --bar-bg: #222;
      --bar-fill: #666;
    }

    .light {
      --bg: #fff;
      --text: #666;
      --heading: #000;
      --link: #666;
      --link-hover: #000;
      --hint: #999;
      --bar-bg: #ddd;
      --bar-fill: #999;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      overflow: hidden;
      background: var(--bg);
      font-family: 'Space Mono', monospace;
      color: var(--text);
      cursor: crosshair;
    }

    #blackout {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 10;
      transition: opacity 0.6s ease-out;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #blackout.off {
      opacity: 0;
      pointer-events: none;
    }

    #blackout img {
      width: 200px;
      image-rendering: pixelated;
    }

    #loading-bar {
      position: absolute;
      bottom: 30%;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 3px;
      background: var(--bar-bg);
      border-radius: 2px;
      overflow: hidden;
    }

    #loading-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--bar-fill);
      transition: width 0.2s ease-out;
    }

    canvas { display: block; }


    /* Bottom center info */
    .info {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      text-align: center;
    }

    .info h1 {
      font-family: 'Libre Baskerville', serif;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--heading);
    }

    .info .tagline {
      margin-top: 0.4rem;
      font-size: 0.7rem;
      color: var(--text);
      letter-spacing: 0.04em;
    }

    .info .links {
      margin-top: 1rem;
      display: flex;
      justify-content: center;
      gap: 1.5rem;
    }

    .info .links a {
      color: var(--link);
      transition: color 0.3s;
    }

    .info .links a:hover {
      color: var(--link-hover);
    }

    .info .hint {
      margin-top: 0.8rem;
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      color: var(--hint);
      text-transform: uppercase;
    }

    @media (max-width: 768px) {
      .info {
        bottom: 3rem;
        width: 90%;
      }

      .info h1 {
        font-size: 1.4rem;
      }

      .info .tagline {
        font-size: 0.6rem;
      }

      .info .links {
        margin-top: 0.7rem;
        gap: 1.2rem;
      }

      .info .hint {
        font-size: 0.5rem;
      }
    }

    #power-button-overlay {
      position: absolute;
      left: 68%;
      top: 62%;
      width: 90px;
      height: 90px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      cursor: pointer;
      z-index: 25;
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.02);
      transition: background 0.2s ease;
      border: 1px solid rgba(255,255,255,0.12);
    }

    #power-button-overlay:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255,255,255,0.3);
    }
  </style>
