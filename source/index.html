<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rodrigo Alvear Yévenes · Ingeniero DevOps Senior</title>
    <meta name="description" content="CV de Rodrigo Alvear Yévenes, Ingeniero DevOps Senior." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/favicons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicons/favicon-96x96.png" />
    <link rel="shortcut icon" href="/favicons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png" />
    <link rel="manifest" href="/favicons/site.webmanifest" />
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="start" class="start" role="button" tabindex="0" aria-label="Click para empezar">
      <div class="start-dots" aria-hidden="true"></div>
      <div class="start-cta">
        <svg class="start-arrow" viewBox="0 0 120 120" aria-hidden="true">
          <path d="M18 14 C 50 18, 88 36, 96 84" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" />
          <path d="M80 80 L97 90 L100 70" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="start-text">CLICK TO START</span>
      </div>
    </div>
    <p class="hint">Conduce con ↑ ↓ ← → o W A S D · pasa por encima de los iconos del suelo para ver cada sección</p>
    <div id="social" class="social" hidden>
      <span id="social-name"></span>
      <button id="social-open" type="button">Abrir · Enter</button>
    </div>
    <main id="card" aria-live="polite"></main>
    <nav class="nav" aria-label="Secciones">
      <button id="prev" aria-label="Sección anterior">←</button>
      <div id="dots"></div>
      <button id="next" aria-label="Sección siguiente">→</button>
    </nav>
    <div class="pad left" aria-label="Dirección">
      <button data-act="left" aria-label="Girar a la izquierda">◀</button>
      <button data-act="right" aria-label="Girar a la derecha">▶</button>
    </div>
    <div class="pad right" aria-label="Pedales">
      <button data-act="brake" aria-label="Frenar o retroceder">▼</button>
      <button data-act="gas" aria-label="Acelerar">▲</button>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
